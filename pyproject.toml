[project]
name = "index-tts"
description = "NODES: IndexTTS-2.5 zero-shot text-to-speech (multilingual, speed control, pronunciation & emotion control) for ComfyUI."
version = "1.0.0"
license = {file = "LICENSE"}
dependencies = [
    "torch>=1.12.0", "torchaudio>=2.0.0", "numpy>=1.20.0", "scipy>=1.7.0",
    "librosa>=0.10.0", "soundfile>=0.10.0", "PyYAML>=6.0", "omegaconf>=2.3.0",
    "transformers>=4.50.0", "huggingface_hub>=0.23.0", "safetensors>=0.4.3",
    "modelscope>=1.13.0", "munch>=4.0.0", "einops", "matplotlib>=3.8.0", "accelerate>=1.8.0",
    "descript-audiotools==0.7.2", "ffmpy", "docstring-parser",
    "wetext", "pynini==2.1.6; platform_system!=\"Windows\"", "WeTextProcessing>=1.0.3; platform_system!=\"Windows\"",
    "tiktoken>=0.7.0", "openai-whisper>=20231117", "cn2an>=0.5.22", "jieba>=0.42.1",
    "g2p-en>=2.1.0", "fugashi>=1.2.0", "unidic-lite>=1.0.0",
]

[project.urls]
Repository = "https://github.com/chenpipi0807/ComfyUI-Index-TTS"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
 # NOTE: Leaving PublisherId blank is fine for normal Git pushes.
 # When you really want to publish to Comfy Registry, fill it with your real Publisher ID.
 PublisherId = ""
 # Machine name (slug). Optional but recommended by registry.
 Name = "comfyui-index-tts"
 # Human-readable display name.
 DisplayName = "ComfyUI-Index-TTS"
 # Icon can be a URL or a relative path in the repo. Placeholder keeps checks relaxed.
 Icon = "assets/icon.png"
